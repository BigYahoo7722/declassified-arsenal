<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DECLASSIFIED: ARSENAL</title>

    <!--
      One web-font family per script, covering all 21 supported languages
      (see src/i18n.js LOCALES for the language -> font-family mapping):
        Noto Sans            Latin + Cyrillic (en, es, fr, de, pt, ru, id, sw, tr, vi)
        Noto Sans Arabic     Arabic (ar)
        Vazirmatn            Persian — a dedicated, more natural-looking Farsi
                              face than Noto's generic Arabic-script fallback
        Noto Nastaliq Urdu   Urdu (traditional Nastaliq calligraphic style)
        Noto Sans Devanagari Hindi, Marathi
        Noto Sans Bengali    Bengali
        Noto Sans Telugu     Telugu
        Noto Sans Tamil      Tamil
        Noto Sans SC         Simplified Chinese
        Noto Sans JP         Japanese
        Noto Sans KR         Korean
      Loaded once, up front, so switching languages never triggers a
      layout-shifting font download mid-session.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-zinc-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
